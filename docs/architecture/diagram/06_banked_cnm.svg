<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
 <title id="title">四 Bank CNM 数据通路</title><desc id="desc">四个 bank-local controller 独立取数和局部累加，只在输出边界做全局归约。</desc>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111827"/></marker><style><![CDATA[
 text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#111827}.title{font-size:30px;font-weight:750}.sub{font-size:14px;fill:#64748B}.box{fill:#FFF2CC;stroke:#D6A43B;stroke-width:1.5}.mem{fill:#F4CCCC;stroke:#C96B6B;stroke-width:1.4}.name{font-size:17px;font-weight:650}.note{font-size:13px;fill:#475569}.stage{font-size:17px;font-weight:700}.line{stroke:#111827;stroke-width:1.7;fill:none;marker-end:url(#a)}.bi{stroke:#111827;stroke-width:1.7;fill:none;marker-start:url(#a);marker-end:url(#a)}.boundary{fill:none;stroke:#111827;stroke-width:1.5;stroke-dasharray:6 5}.sep{stroke:#6B8BC3;stroke-width:3;stroke-dasharray:10 8}
 ]]></style></defs><rect width="1500" height="760" fill="#FFF"/>
 <text x="48" y="48" class="title">Banked CNM：四条本地流水，末端一次归约</text><text x="48" y="75" class="sub">每个 Bank 有独立地址、请求、响应和 Local Accumulator；中间 partial sum 不跨 Bank 传输</text>
 <rect x="65" y="110" width="1370" height="575" class="boundary"/><line x1="320" y1="110" x2="320" y2="685" class="sep"/><line x1="760" y1="110" x2="760" y2="685" class="sep"/><line x1="1080" y1="110" x2="1080" y2="685" class="sep"/>
 <rect x="95" y="150" width="180" height="85" rx="3" class="mem"/><text x="185" y="184" text-anchor="middle" class="name">SRAM Bank 0</text><text x="185" y="211" text-anchor="middle" class="note">独立地址 / 响应</text>
 <rect x="95" y="260" width="180" height="85" rx="3" class="mem"/><text x="185" y="294" text-anchor="middle" class="name">SRAM Bank 1</text><text x="185" y="321" text-anchor="middle" class="note">独立地址 / 响应</text>
 <rect x="95" y="370" width="180" height="85" rx="3" class="mem"/><text x="185" y="404" text-anchor="middle" class="name">SRAM Bank 2</text><text x="185" y="431" text-anchor="middle" class="note">独立地址 / 响应</text>
 <rect x="95" y="480" width="180" height="85" rx="3" class="mem"/><text x="185" y="514" text-anchor="middle" class="name">SRAM Bank 3</text><text x="185" y="541" text-anchor="middle" class="note">独立地址 / 响应</text>
 <rect x="370" y="145" width="335" height="95" rx="3" class="box"/><text x="537" y="178" text-anchor="middle" class="name">Local Controller + PE 0</text><text x="537" y="205" text-anchor="middle" class="note">address → prefetch → dot4 → local_acc0</text><text x="537" y="228" text-anchor="middle" class="note">ai_bank_local_controller / ai_bank_pe</text>
 <rect x="370" y="255" width="335" height="95" rx="3" class="box"/><text x="537" y="288" text-anchor="middle" class="name">Local Controller + PE 1</text><text x="537" y="315" text-anchor="middle" class="note">address → prefetch → dot4 → local_acc1</text><text x="537" y="338" text-anchor="middle" class="note">独立 request / response lane</text>
 <rect x="370" y="365" width="335" height="95" rx="3" class="box"/><text x="537" y="398" text-anchor="middle" class="name">Local Controller + PE 2</text><text x="537" y="425" text-anchor="middle" class="note">address → prefetch → dot4 → local_acc2</text><text x="537" y="448" text-anchor="middle" class="note">独立 request / response lane</text>
 <rect x="370" y="475" width="335" height="95" rx="3" class="box"/><text x="537" y="508" text-anchor="middle" class="name">Local Controller + PE 3</text><text x="537" y="535" text-anchor="middle" class="note">address → prefetch → dot4 → local_acc3</text><text x="537" y="558" text-anchor="middle" class="note">独立 request / response lane</text>
 <path d="M275 192H370" class="bi"/><path d="M275 302H370" class="bi"/><path d="M275 412H370" class="bi"/><path d="M275 522H370" class="bi"/>
 <rect x="810" y="245" width="220" height="220" rx="3" class="box"/><text x="920" y="286" text-anchor="middle" class="name">Global Reducer</text><text x="920" y="320" text-anchor="middle" class="note">sum0 + sum1</text><text x="920" y="346" text-anchor="middle" class="note">+ sum2 + sum3</text><text x="920" y="380" text-anchor="middle" class="note">shift · ReLU</text><text x="920" y="406" text-anchor="middle" class="note">saturate / quantize</text><text x="920" y="440" text-anchor="middle" class="note">仅在输出边界归约</text>
 <path d="M705 192H785V300H810" class="line"/><path d="M705 302H810" class="line"/><path d="M705 412H810" class="line"/><path d="M705 522H785V410H810" class="line"/>
 <rect x="1130" y="245" width="240" height="220" rx="3" class="box"/><text x="1250" y="286" text-anchor="middle" class="name">Writeback + Control</text><text x="1250" y="320" text-anchor="middle" class="note">result → dst SPAD</text><text x="1250" y="346" text-anchor="middle" class="note">next output row</text><text x="1250" y="380" text-anchor="middle" class="note">done / error</text><text x="1250" y="406" text-anchor="middle" class="note">events / counters</text><text x="1250" y="440" text-anchor="middle" class="note">ai_banked_cnm_core</text>
 <path d="M1030 355H1130" class="line"/>
 <text x="185" y="650" text-anchor="middle" class="stage">Stage 1 · Bank Read</text><text x="537" y="650" text-anchor="middle" class="stage">Stage 2 · Local Accumulate</text><text x="920" y="650" text-anchor="middle" class="stage">Stage 3 · Global Reduce</text><text x="1250" y="650" text-anchor="middle" class="stage">Stage 4 · Writeback</text>
</svg>
