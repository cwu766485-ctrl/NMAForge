<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
 <title id="title">128-bit DMA Pipeline</title><desc id="desc">DMA 从配置、burst 规划、AXI 传输到 SPAD 访问与完成的流水。</desc>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111827"/></marker><style><![CDATA[
 text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#111827}.title{font-size:30px;font-weight:750}.sub{font-size:14px;fill:#64748B}.box{fill:#FFF2CC;stroke:#D6A43B;stroke-width:1.5}.side{fill:#F4CCCC;stroke:#C96B6B;stroke-width:1.4}.name{font-size:18px;font-weight:650}.note{font-size:13px;fill:#475569}.stage{font-size:17px;font-weight:700}.line{stroke:#111827;stroke-width:1.7;fill:none;marker-end:url(#a)}.bi{stroke:#111827;stroke-width:1.7;fill:none;marker-start:url(#a);marker-end:url(#a)}.boundary{fill:none;stroke:#111827;stroke-width:1.5;stroke-dasharray:6 5}.sep{stroke:#6B8BC3;stroke-width:3;stroke-dasharray:10 8}
 ]]></style></defs><rect width="1500" height="720" fill="#FFF"/>
 <text x="48" y="48" class="title">128-bit DMA：DDR 与 SPAD 之间怎样搬数据</text><text x="48" y="75" class="sub">同一后端支持 1D / 2D / Gather / Tile，读方向支持最多四笔 tagged outstanding</text>
 <rect x="65" y="110" width="1370" height="535" class="boundary"/><line x1="345" y1="110" x2="345" y2="645" class="sep"/><line x1="625" y1="110" x2="625" y2="645" class="sep"/><line x1="905" y1="110" x2="905" y2="645" class="sep"/><line x1="1185" y1="110" x2="1185" y2="645" class="sep"/>
 <rect x="95" y="225" width="210" height="135" rx="3" class="box"/><text x="200" y="264" text-anchor="middle" class="name">请求锁存</text><text x="200" y="293" text-anchor="middle" class="note">方向 · 模式 · 长度</text><text x="200" y="318" text-anchor="middle" class="note">外部地址 · SPAD 地址</text><text x="200" y="342" text-anchor="middle" class="note">start / abort</text>
 <rect x="375" y="225" width="220" height="135" rx="3" class="box"/><text x="485" y="264" text-anchor="middle" class="name">地址与 Burst 规划</text><text x="485" y="293" text-anchor="middle" class="note">最大 16 beat</text><text x="485" y="318" text-anchor="middle" class="note">4 KiB boundary split</text><text x="485" y="342" text-anchor="middle" class="note">row / stride / gather</text>
 <rect x="655" y="225" width="220" height="135" rx="3" class="box"/><text x="765" y="264" text-anchor="middle" class="name">AXI 事务引擎</text><text x="765" y="293" text-anchor="middle" class="note">AR / R 或 AW / W / B</text><text x="765" y="318" text-anchor="middle" class="note">RID / BID · LAST</text><text x="765" y="342" text-anchor="middle" class="note">back-pressure</text>
 <rect x="935" y="225" width="220" height="135" rx="3" class="box"/><text x="1045" y="264" text-anchor="middle" class="name">数据与标签缓冲</text><text x="1045" y="293" text-anchor="middle" class="note">128-bit line data</text><text x="1045" y="318" text-anchor="middle" class="note">ID → 目的地址关联</text><text x="1045" y="342" text-anchor="middle" class="note">abort drain</text>
 <rect x="1215" y="225" width="190" height="135" rx="3" class="box"/><text x="1310" y="264" text-anchor="middle" class="name">SPAD 端口</text><text x="1310" y="293" text-anchor="middle" class="note">line read / write</text><text x="1310" y="318" text-anchor="middle" class="note">valid / ready</text><text x="1310" y="342" text-anchor="middle" class="note">done / error</text>
 <path d="M305 292H375" class="line"/><path d="M595 292H655" class="line"/><path d="M875 292H935" class="line"/><path d="M1155 292H1215" class="bi"/>
 <rect x="655" y="435" width="220" height="85" rx="3" class="side"/><text x="765" y="468" text-anchor="middle" class="name">外部 AXI4</text><text x="765" y="496" text-anchor="middle" class="note">Descriptor ID0；DMA ID1–4</text><path d="M765 435V360" class="bi"/>
 <rect x="935" y="435" width="220" height="85" rx="3" class="side"/><text x="1045" y="468" text-anchor="middle" class="name">Outstanding Table</text><text x="1045" y="496" text-anchor="middle" class="note">最多四笔读事务</text><path d="M1045 435V360" class="bi"/>
 <text x="200" y="612" text-anchor="middle" class="stage">Stage 1 · Capture</text><text x="485" y="612" text-anchor="middle" class="stage">Stage 2 · Plan</text><text x="765" y="612" text-anchor="middle" class="stage">Stage 3 · AXI</text><text x="1045" y="612" text-anchor="middle" class="stage">Stage 4 · Buffer</text><text x="1310" y="612" text-anchor="middle" class="stage">Stage 5 · SPAD</text>
</svg>
