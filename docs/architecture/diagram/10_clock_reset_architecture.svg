<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">NMAForge clock and reset architecture</title><desc id="desc">Current RTL has one clock and one active-low asynchronous reset.</desc><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:10}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}.r{stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1000" height="430" fill="white"/><text x="35" y="45" class="h">NMAForge — clock/reset architecture</text><text x="35" y="73" class="s">Confirmed from current RTL: no implemented multi-clock CDC path or async FIFO.</text><rect x="70" y="150" width="180" height="85" class="box" fill="#e0f2fe"/><text x="160" y="185" text-anchor="middle" class="b">aclk</text><text x="160" y="211" text-anchor="middle" class="s">single synchronous domain</text><rect x="365" y="105" width="560" height="175" class="box" fill="#f8fafc"/><text x="645" y="145" text-anchor="middle" class="b">All major RTL blocks</text><text x="645" y="175" text-anchor="middle" class="s">control / command / DMA / SPAD / compute / performance</text><text x="645" y="202" text-anchor="middle" class="s">same `aclk`, no CDC bridge shown</text><text x="645" y="229" text-anchor="middle" class="s">async active-low reset input: `aresetn`</text><path d="M250 192 H365" class="a"/><rect x="70" y="315" width="180" height="60" class="box" fill="#ede9fe"/><text x="160" y="351" text-anchor="middle" class="b">aresetn</text><path d="M250 345 H365 V255" class="r"/><text x="275" y="336" class="s">async reset fanout</text><text x="365" y="405" class="s">RDC still requires separate closure; this diagram does not claim RDC sign-off.</text></svg>
