<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
 <title id="title">计算集群</title><desc id="desc">opcode 解码选择六类计算引擎，存储请求汇聚到 SPAD，完成信息统一返回。</desc>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111827"/></marker><style><![CDATA[
 text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#111827}.title{font-size:30px;font-weight:750}.sub{font-size:14px;fill:#64748B}.box{fill:#FFF2CC;stroke:#D6A43B;stroke-width:1.5}.unit{fill:#FFF8E5;stroke:#D6A43B;stroke-width:1.3}.side{fill:#F4CCCC;stroke:#C96B6B;stroke-width:1.4}.name{font-size:18px;font-weight:650}.note{font-size:13px;fill:#475569}.stage{font-size:17px;font-weight:700}.line{stroke:#111827;stroke-width:1.7;fill:none;marker-end:url(#a)}.bi{stroke:#111827;stroke-width:1.7;fill:none;marker-start:url(#a);marker-end:url(#a)}.boundary{fill:none;stroke:#111827;stroke-width:1.5;stroke-dasharray:6 5}.sep{stroke:#6B8BC3;stroke-width:3;stroke-dasharray:10 8}
 ]]></style></defs><rect width="1500" height="760" fill="#FFF"/>
 <text x="48" y="48" class="title">Compute Cluster：一个 Opcode 只启动一个引擎</text><text x="48" y="75" class="sub">统一 launch ABI；不同引擎共享 SPAD 访问入口，done / error / result 统一汇聚</text>
 <rect x="65" y="110" width="1370" height="575" class="boundary"/><line x1="350" y1="110" x2="350" y2="685" class="sep"/><line x1="1080" y1="110" x2="1080" y2="685" class="sep"/>
 <rect x="95" y="230" width="210" height="145" rx="3" class="box"/><text x="200" y="270" text-anchor="middle" class="name">Launch Decode</text><text x="200" y="300" text-anchor="middle" class="note">opcode → one-hot select</text><text x="200" y="326" text-anchor="middle" class="note">src / dst / dimensions</text><text x="200" y="352" text-anchor="middle" class="note">abort / watchdog</text>
 <rect x="410" y="145" width="190" height="100" rx="3" class="unit"/><text x="505" y="181" text-anchor="middle" class="name">Scalar INT8</text><text x="505" y="209" text-anchor="middle" class="note">VDOT · GEMV · GEMM tile</text><text x="505" y="231" text-anchor="middle" class="note">ai_int8_compute_core</text>
 <rect x="635" y="145" width="190" height="100" rx="3" class="unit"/><text x="730" y="181" text-anchor="middle" class="name">Banked CNM</text><text x="730" y="209" text-anchor="middle" class="note">4-lane local accumulate</text><text x="730" y="231" text-anchor="middle" class="note">ai_banked_cnm_core</text>
 <rect x="860" y="145" width="190" height="100" rx="3" class="unit"/><text x="955" y="181" text-anchor="middle" class="name">Matrix</text><text x="955" y="209" text-anchor="middle" class="note">4×4 tile · QKV / FFN</text><text x="955" y="231" text-anchor="middle" class="note">ai_tensor_matrix_core</text>
 <rect x="410" y="355" width="190" height="100" rx="3" class="unit"/><text x="505" y="391" text-anchor="middle" class="name">SFU</text><text x="505" y="419" text-anchor="middle" class="note">Softmax · Norm · Activation</text><text x="505" y="441" text-anchor="middle" class="note">ai_tensor_sfu_core</text>
 <rect x="635" y="355" width="190" height="100" rx="3" class="unit"/><text x="730" y="391" text-anchor="middle" class="name">CNN</text><text x="730" y="419" text-anchor="middle" class="note">Conv3×3 · line buffer</text><text x="730" y="441" text-anchor="middle" class="note">ai_conv3x3_linebuffer_core</text>
 <rect x="860" y="355" width="190" height="100" rx="3" class="unit"/><text x="955" y="391" text-anchor="middle" class="name">KV Cache</text><text x="955" y="419" text-anchor="middle" class="note">token / head / stride</text><text x="955" y="441" text-anchor="middle" class="note">ai_kv_cache_engine</text>
 <path d="M305 302H380V125H955" class="line"/>
 <path d="M505 125V145" class="line"/><path d="M730 125V145" class="line"/><path d="M955 125V145" class="line"/>
 <path d="M380 302V500H955" class="line"/>
 <path d="M505 500V455" class="line"/><path d="M730 500V455" class="line"/><path d="M955 500V455" class="line"/>
 <text x="620" y="119" text-anchor="middle" class="note">one-hot start（并行候选，上排）</text>
 <text x="620" y="520" text-anchor="middle" class="note">one-hot start（并行候选，下排）</text>
 <rect x="1095" y="270" width="165" height="100" rx="3" class="box"/><text x="1177" y="306" text-anchor="middle" class="name">被选引擎接口</text><text x="1177" y="335" text-anchor="middle" class="note">六选一 MUX</text><text x="1177" y="357" text-anchor="middle" class="note">request + result</text>
 <rect x="1290" y="170" width="120" height="125" rx="3" class="side"/><text x="1350" y="207" text-anchor="middle" class="name">SPAD</text><text x="1350" y="237" text-anchor="middle" class="note">scalar / line</text><text x="1350" y="261" text-anchor="middle" class="note">banked / CNM</text><text x="1350" y="283" text-anchor="middle" class="note">→ arbiter</text>
 <rect x="1290" y="385" width="120" height="125" rx="3" class="box"/><text x="1350" y="421" text-anchor="middle" class="name">完成汇聚</text><text x="1350" y="451" text-anchor="middle" class="note">done / error</text><text x="1350" y="475" text-anchor="middle" class="note">result / cycles</text><text x="1350" y="497" text-anchor="middle" class="note">elements</text>
 <path d="M1050 195H1070V305H1095" class="bi"/><path d="M1050 405H1070V340H1095" class="bi"/>
 <path d="M1260 305H1275V232H1290" class="line"/><path d="M1260 340H1275V447H1290" class="line"/>
 <text x="1080" y="178" text-anchor="middle" class="note">所有引擎具备同一类接口</text>
 <text x="200" y="650" text-anchor="middle" class="stage">Stage 1 · Decode</text><text x="730" y="650" text-anchor="middle" class="stage">Stage 2 · Execute（六选一）</text><text x="1250" y="650" text-anchor="middle" class="stage">Stage 3 · Interface / Result</text>
</svg>
