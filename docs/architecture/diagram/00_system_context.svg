<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NMAForge system context</title><desc id="desc">Single-clock digital compute-near-memory accelerator with AXI-Lite control, AXI4 DMA and interrupt.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033} .h{font-size:24px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:10}.ctl{fill:#e0f2fe}.data{fill:#dcfce7}.mem{fill:#fef3c7}.int{fill:#ede9fe}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:8}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}.d{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1200" height="620" fill="white"/><text x="40" y="48" class="h">NMAForge — system context</text><text x="40" y="75" class="s">Evidence: rtl/top/ai_accel_top.v; current RTL uses one aclk domain and active-low asynchronous reset.</text>
<rect x="55" y="145" width="190" height="105" class="box ctl"/><text x="150" y="180" text-anchor="middle" class="b">CPU / SoC</text><text x="150" y="207" text-anchor="middle" class="s">software driver</text><text x="150" y="230" text-anchor="middle" class="s">CMDQ/CPLQ producer/consumer</text>
<rect x="300" y="115" width="260" height="165" class="box ctl"/><text x="430" y="150" text-anchor="middle" class="b">NMAForge IP</text><text x="430" y="180" text-anchor="middle" class="s">AXI-Lite control + registers</text><text x="430" y="205" text-anchor="middle" class="s">command processor / IRQ</text><text x="430" y="230" text-anchor="middle" class="s">DMA + compute + scratchpad</text><text x="430" y="255" text-anchor="middle" class="s">[aclk, aresetn]</text>
<rect x="650" y="145" width="210" height="105" class="box mem"/><text x="755" y="180" text-anchor="middle" class="b">External DDR</text><text x="755" y="207" text-anchor="middle" class="s">descriptors / tensors</text><text x="755" y="230" text-anchor="middle" class="s">AXI4 target</text>
<rect x="930" y="145" width="210" height="105" class="box int"/><text x="1035" y="180" text-anchor="middle" class="b">Interrupt target</text><text x="1035" y="207" text-anchor="middle" class="s">CPU IRQ input</text><text x="1035" y="230" text-anchor="middle" class="s">sticky done/error</text>
<path d="M245 175 H300" class="d"/><text x="272" y="162" class="s">AXI4-Lite</text><path d="M560 175 H650" class="a"/><text x="580" y="162" class="s">AXI4 M, 128-bit</text><path d="M560 215 H930" class="d"/><text x="690" y="205" class="s">IRQ</text>
<rect x="250" y="370" width="700" height="145" class="note"/><text x="275" y="405" class="b">Architectural boundary</text><text x="275" y="433" class="s">Digital CNM: arithmetic is adjacent to ordinary SRAM banks; no analog bit-cell/bit-line CIM is claimed.</text><text x="275" y="461" class="s">Scratchpad: 512 KiB, 4 logical banks; scheduler-side access has one admission point.</text><text x="275" y="489" class="s">Theoretical AXI4 peak at 250 MHz: 128 bit × 250 MHz / 8 = 4 GB/s per direction.</text>
</svg>
